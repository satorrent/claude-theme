<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaudeTheme</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>ClaudeTheme</h1>
    </div>
    <p class="fine" data-i18n="unofficial"></p>
  </header>

  <main>
    <p class="intro" data-i18n="pickIntro"></p>
    <div class="themes" role="radiogroup" data-i18n-label="themesLabel"></div>
  </main>

  <footer class="actions">
    <button type="button" id="apply" class="primary" data-i18n="applyButton" disabled></button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button type="button" id="reload-tab" class="ghost" data-i18n="reloadTabButton" hidden></button>
  </footer>

  <template id="theme-card">
    <button type="button" class="card" role="radio" aria-checked="false">
      <span class="mini" aria-hidden="true">
        <span class="mini-side"></span>
        <span class="mini-main">
          <span class="mini-bubble">Aa</span>
          <span class="mini-line"></span>
          <span class="mini-line short"></span>
          <span class="mini-input"><span class="mini-send"></span></span>
        </span>
      </span>
      <span class="card-text">
        <span class="card-name"></span>
        <span class="card-meta"></span>
      </span>
    </button>
  </template>

  <script src="popup.js"></script>
</body>
</html>
